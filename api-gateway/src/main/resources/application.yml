server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: movie-service
          uri: ${MOVIE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/filmes/**
        - id: series-service
          uri: ${SERIES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/series/**
        - id: evaluation-service
          uri: ${EVALUATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/avalicao/**
